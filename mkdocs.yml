site_name: Intelligent API Security Gateway
site_description: Engineering documentation for the Go-based API security gateway.
repo_name: Intelligent_API_Security_Gateway
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js
nav:
  - Overview: index.md
  - Architecture:
      - System Architecture: system-architecture.md
      - Request Lifecycle: request-lifecycle.md
      - Project Structure: project-structure.md
  - Modules:
      - Proxy Module: modules/proxy-module.md
  - Operations:
      - Running the Gateway Locally: running-locally.md