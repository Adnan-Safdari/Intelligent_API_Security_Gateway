services:
  ports_info:
    image: alpine:3.21
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        echo "Port map:" &&
        echo "- Gateway API:          http://localhost:8080" &&
        echo "- Vulnerable API:       http://localhost:4000" &&
        echo "- Gateway Dashboard API:http://localhost:4001" &&
        echo "- Vulnerable Web:       http://localhost:5173" &&
        echo "- Dashboard Web:        http://localhost:5174" &&
        echo "- MkDocs:               http://localhost:8000" &&
        echo "- Postgres:             localhost:5432" &&
        echo "- Redis:                localhost:6379"

  postgres:
    image: postgres:18.2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iasg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-iasg}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iasg_user} -d ${POSTGRES_DB:-iasg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vulnerable_api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../vulnerable-application/api:/app
      - vulnerable_api_node_modules:/app/node_modules
    environment:
      PORT: 4000
    command: sh -c "npm ci && npm start"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway_dashboard_api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway-dashboard/api:/app
      - gateway_dashboard_api_node_modules:/app/node_modules
    environment:
      PORT: 4001
    command: sh -c "npm ci && npm start"
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  vulnerable_web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../vulnerable-application/web:/app
      - vulnerable_web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - vulnerable_api

  gateway_dashboard_web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway-dashboard/web:/app
      - gateway_dashboard_web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    depends_on:
      - gateway_dashboard_api

  gateway:
    image: golang:1.23-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway:/app
    environment:
      IASG_CONFIG: configs/config.docker.yaml
    command: sh -c "go run ./cmd/server"
    ports:
      - "8080:8080"
    depends_on:
      vulnerable_api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  docs:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: sh -c "pip install --no-cache-dir -r gateway/docs/requirements.txt && mkdocs serve -f mkdocs.yml -a 0.0.0.0:8000"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
  vulnerable_api_node_modules:
  gateway_dashboard_api_node_modules:
  vulnerable_web_node_modules:
  gateway_dashboard_web_node_modules: