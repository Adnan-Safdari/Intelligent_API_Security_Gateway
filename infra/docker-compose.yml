services:
  ports_info:
    image: alpine:3.21
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        echo "Port map:" &&
        echo "- Gateway API:          http://localhost:8082" &&
        echo "- Vulnerable API:       http://localhost:5002" &&
        echo "- Gateway Dashboard:    http://localhost:5177" &&
        echo "- Vulnerable Web:       http://localhost:5175" &&
        echo "- MkDocs:               http://localhost:8000" &&
        echo "- Postgres (Gateway):   localhost:5434" &&
        echo "- Postgres (Vuln API):  localhost:5435" &&
        echo "- Redis:                localhost:6379" &&
        echo "- Control plane:        python agent (no HTTP port)"

  postgres:
    image: postgres:18.2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iasg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-iasg}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iasg_user} -d ${POSTGRES_DB:-iasg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vulnerable_postgres:
    image: postgres:18.2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${VULN_POSTGRES_USER:-vuln_user}
      POSTGRES_PASSWORD: ${VULN_POSTGRES_PASSWORD:-vuln_changeme}
      POSTGRES_DB: ${VULN_POSTGRES_DB:-vuln_app}

    ports:
      - "5435:5432"
    volumes:
      - vulnerable_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VULN_POSTGRES_USER:-vuln_user} -d ${VULN_POSTGRES_DB:-vuln_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vulnerable_api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../vulnerable-app/backend:/app
      - vulnerable_api_node_modules:/app/node_modules
    environment:
      PORT: 5002
      PGHOST: vulnerable_postgres
      PGPORT: 5432
      PGUSER: ${VULN_POSTGRES_USER:-vuln_user}
      PGPASSWORD: ${VULN_POSTGRES_PASSWORD:-vuln_changeme}
      PGDATABASE: ${VULN_POSTGRES_DB:-vuln_app}
    command: sh -c "npm ci && npm start"
    ports:
      - "5002:5002"
    depends_on:
      vulnerable_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway_dashboard:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway-dashboard:/app
      - gateway_dashboard_node_modules:/app/node_modules
      # Keep Next's Linux build cache out of the bind mount. A cache generated
      # on the Windows host can otherwise leave the container referencing
      # chunks that do not exist there after an edit or rebuild.
      - gateway_dashboard_next:/app/.next
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Live panels read Redis; the campaign history reads the record.
      IASG_POSTGRES_URL: postgresql://${POSTGRES_USER:-iasg_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-iasg}
    # `.next` is a mounted volume, so clear its contents rather than trying
    # to remove the mount point itself.
    command: sh -c "find .next -mindepth 1 -delete && npm ci && npm run dev"
    ports:
      - "5177:5177"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

  vulnerable_web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../vulnerable-app:/app
      - vulnerable_web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5175"
    ports:
      - "5175:5175"
    depends_on:
      - vulnerable_api

  gateway:
    image: golang:1.23-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway:/app
    environment:
      # Override for a dataset capture run:
      #   IASG_CONFIG=configs/config.collect.yaml docker compose up -d gateway
      # A second gateway service would collide on 8082, so the config is
      # selected rather than the service duplicated.
      IASG_CONFIG: ${IASG_CONFIG:-configs/config.yaml}
      IASG_BACKEND_URL: http://vulnerable_api:5002
      IASG_REDIS_HOST: redis
    command: sh -c "go run ./cmd/server"
    ports:
      - "8082:8082"
    depends_on:
      vulnerable_api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  control_plane:
    # glibc-based image keeps the official scikit-learn wheels available;
    # Alpine would compile NumPy/SciPy on every start.
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../control-plane:/app
      - control_plane_models:/app/models
      - ../datasets:/datasets:ro
    environment:
      # Without this Python block-buffers stdout when it is not a TTY, so the
      # agent's per-cycle reasoning never reaches `docker compose logs` and the
      # control plane looks dead even while it is writing campaigns.
      PYTHONUNBUFFERED: "1"
      IASG_REDIS_URL: redis://redis:6379/0
      IASG_EVIDENCE_STREAM: iasg:events
      IASG_DRY_RUN: "false"
      # Narration. The explanation and assessment agents write the prose the
      # console shows; without a provider the first falls back to a template
      # and the second produces nothing at all.
      #
      # Points at Ollama on the HOST, not a container: on Apple Silicon the
      # native app reaches the GPU and a Linux container here cannot, and it
      # avoids a second copy of a 2GB model. `extra_hosts` makes the same name
      # resolve on Linux, where it is not built in.
      #
      # One platform difference: Docker Desktop proxies this name to the host's
      # loopback, so an Ollama listening only on 127.0.0.1 is reachable. Native
      # Linux Docker routes to the bridge address instead, where it is not --
      # run Ollama with OLLAMA_HOST=0.0.0.0 there.
      #
      # Set IASG_LLM_PROVIDER=null in infra/.env to switch narration off. A
      # provider that is configured but unreachable is not an error either --
      # every call degrades to the template and says so once.
      IASG_LLM_PROVIDER: ${IASG_LLM_PROVIDER:-ollama}
      IASG_OLLAMA_URL: ${IASG_OLLAMA_URL:-http://host.docker.internal:11434}
      IASG_OLLAMA_MODEL: ${IASG_OLLAMA_MODEL:-llama3.2}
      # Campaigns and feedback outlive a restart. Policy keys stay in Redis.
      IASG_POSTGRES_URL: postgresql://${POSTGRES_USER:-iasg_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-iasg}
      IASG_HEALTH_STREAM: iasg:telemetry:health
      IASG_MODEL_PATH: /app/models/current/model.joblib
      IASG_MODEL_METADATA_PATH: /app/models/current/metadata.json
    command: sh -c "pip install --no-cache-dir -e '.[postgres,ml]' && PYTHONPATH=/app python -m iasg"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

  docs:
    image: python:3.12-alpine
    restart: unless-stopped
    # mkdocs.yml lives at the repository root and points docs_dir at
    # gateway/docs, so the build has to run from the root. Running it from
    # gateway/ picked up a second, stale config that shipped a different
    # theme and referenced a renderer that no longer exists.
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: sh -c "pip install --no-cache-dir -r gateway/docs/requirements.txt && mkdocs serve -a 0.0.0.0:8000"
    ports:
      - "8000:8000"

  # --- Dataset collection. Off unless --profile collect is passed. ---------
  #
  #   IASG_CONFIG=configs/config.collect.yaml \
  #     docker compose -f infra/docker-compose.yml up -d gateway
  #   docker compose -f infra/docker-compose.yml --profile collect run --rm traffic
  #
  # Runs from inside the compose network on purpose. Docker Desktop rewrites a
  # host request's source address, so traffic from the host arrives as one
  # private address and every persona collapses into it. The generator's
  # pre-flight refuses to start when that happens rather than producing a
  # dataset that is silently one client pretending to be forty.
  traffic:
    profiles: ["collect"]
    image: python:3.12-alpine
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace
      # Passed through explicitly. The command below defers these to the
      # container's shell with $$, so an unlisted variable is simply never set
      # and every run silently becomes run1 -- overwriting the previous one.
      RUN_ID: ${RUN_ID:-run1}
      TRAFFIC_SECONDS: ${TRAFFIC_SECONDS:-180}
    # redis>=5.0 is quoted because this string is parsed by the container's
    # shell, where > is a redirection: unquoted it installs plain `redis` and
    # writes a file called =5.0 into the bind-mounted repository root.
    command:
      - sh
      - -c
      - >-
        pip install --no-cache-dir 'redis>=5.0' &&
        python -m testing.traffic.generate
        --run-id "$${RUN_ID:-run1}"
        --out "datasets/raw/$${RUN_ID:-run1}"
        --gateway http://gateway:8082
        --redis redis://redis:6379/0
        --seconds "$${TRAFFIC_SECONDS:-180}"
    # Deliberately does NOT depend_on gateway. `compose run` starts a
    # dependency with the invoking shell's environment, which silently
    # recreated the gateway on the default config -- reverting stream_maxlen
    # from 200000 to 2000 in the middle of a collection run. The pre-flight
    # below is a stronger readiness check than `service_started` anyway: it
    # proves the gateway is up *and* that it believes our addresses.
    depends_on:
      redis:
        condition: service_healthy

  # Drains the three telemetry streams to datasets/raw/<run_id>/. Its own
  # consumer group, so it does not disturb the control plane's.
  capture:
    profiles: ["collect"]
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ../control-plane:/app
      - ../datasets:/datasets
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      IASG_REDIS_URL: redis://redis:6379/0
      RUN_ID: ${RUN_ID:-run1}
      CAPTURE_SECONDS: ${CAPTURE_SECONDS:-300}
    command:
      - sh
      - -c
      - >-
        pip install --no-cache-dir 'redis>=5.0' &&
        python -m iasg.dataset.capture
        --run-id "$${RUN_ID:-run1}"
        --out "/datasets/raw/$${RUN_ID:-run1}"
        --seconds "$${CAPTURE_SECONDS:-300}"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  vulnerable_postgres_data:
  redis_data:
  vulnerable_api_node_modules:
  gateway_dashboard_node_modules:
  gateway_dashboard_next:
  control_plane_models:
  vulnerable_web_node_modules:
