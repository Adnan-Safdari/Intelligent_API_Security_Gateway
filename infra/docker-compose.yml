services:
  ports_info:
    image: alpine:3.21
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        echo "Port map:" &&
        echo "- Gateway API:          http://localhost:8082" &&
        echo "- Vulnerable API:       http://localhost:5002" &&
        echo "- Gateway Dashboard:    http://localhost:5177" &&
        echo "- Vulnerable Web:       http://localhost:5175" &&
        echo "- MkDocs:               http://localhost:8000" &&
        echo "- Postgres (Gateway):   localhost:5434" &&
        echo "- Postgres (Vuln API):  localhost:5435" &&
        echo "- Redis:                localhost:6379" &&
        echo "- Control plane:        python agent (no HTTP port)"

  postgres:
    image: postgres:18.2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iasg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-iasg}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iasg_user} -d ${POSTGRES_DB:-iasg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vulnerable_postgres:
    image: postgres:18.2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${VULN_POSTGRES_USER:-vuln_user}
      POSTGRES_PASSWORD: ${VULN_POSTGRES_PASSWORD:-vuln_changeme}
      POSTGRES_DB: ${VULN_POSTGRES_DB:-vuln_app}

    ports:
      - "5435:5432"
    volumes:
      - vulnerable_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VULN_POSTGRES_USER:-vuln_user} -d ${VULN_POSTGRES_DB:-vuln_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vulnerable_api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../vulnerable-app/backend:/app
      - vulnerable_api_node_modules:/app/node_modules
    environment:
      PORT: 5002
      PGHOST: vulnerable_postgres
      PGPORT: 5432
      PGUSER: ${VULN_POSTGRES_USER:-vuln_user}
      PGPASSWORD: ${VULN_POSTGRES_PASSWORD:-vuln_changeme}
      PGDATABASE: ${VULN_POSTGRES_DB:-vuln_app}
      AUTH_MODE: db_secure
    command: sh -c "npm ci && npm start"
    ports:
      - "5002:5002"
    depends_on:
      vulnerable_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway_dashboard:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway-dashboard:/app
      - gateway_dashboard_node_modules:/app/node_modules
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Live panels read Redis; the campaign history reads the record.
      IASG_POSTGRES_URL: postgresql://${POSTGRES_USER:-iasg_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-iasg}
    command: sh -c "npm ci && npm run dev"
    ports:
      - "5177:5177"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

  vulnerable_web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../vulnerable-app:/app
      - vulnerable_web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5175"
    ports:
      - "5175:5175"
    depends_on:
      - vulnerable_api

  gateway:
    image: golang:1.23-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway:/app
    environment:
      IASG_CONFIG: configs/config.yaml
      IASG_BACKEND_URL: http://vulnerable_api:5002
      IASG_REDIS_HOST: redis
    command: sh -c "go run ./cmd/server"
    ports:
      - "8082:8082"
    depends_on:
      vulnerable_api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  control_plane:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../control-plane:/app
    environment:
      # Without this Python block-buffers stdout when it is not a TTY, so the
      # agent's per-cycle reasoning never reaches `docker compose logs` and the
      # control plane looks dead even while it is writing campaigns.
      PYTHONUNBUFFERED: "1"
      IASG_REDIS_URL: redis://redis:6379/0
      IASG_EVIDENCE_STREAM: iasg:events
      IASG_DRY_RUN: "false"
      # Campaigns and feedback outlive a restart. Policy keys stay in Redis.
      IASG_POSTGRES_URL: postgresql://${POSTGRES_USER:-iasg_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-iasg}
    command: sh -c "pip install --no-cache-dir redis 'psycopg[binary]' && PYTHONPATH=/app python -m iasg"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

  docs:
    image: python:3.12-alpine
    restart: unless-stopped
    # mkdocs.yml lives at the repository root and points docs_dir at
    # gateway/docs, so the build has to run from the root. Running it from
    # gateway/ picked up a second, stale config that shipped a different
    # theme and referenced a renderer that no longer exists.
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: sh -c "pip install --no-cache-dir -r gateway/docs/requirements.txt && mkdocs serve -a 0.0.0.0:8000"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  vulnerable_postgres_data:
  redis_data:
  vulnerable_api_node_modules:
  gateway_dashboard_node_modules:
  vulnerable_web_node_modules: