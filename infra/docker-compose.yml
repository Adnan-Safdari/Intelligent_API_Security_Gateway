services:
  ports_info:
    image: alpine:3.21
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        echo "Port map:" &&
        echo "- Gateway API:          http://localhost:8082" &&
        echo "- Vulnerable API:       http://localhost:5002" &&
        echo "- Gateway Dashboard API:http://localhost:4004" &&
        echo "- Vulnerable Web:       http://localhost:5175" &&
        echo "- Dashboard Web:        http://localhost:5177" &&
        echo "- MkDocs:               http://localhost:8000" &&
        echo "- Postgres (Gateway):   localhost:5434" &&
        echo "- Postgres (Vuln API):  localhost:5435" &&
        echo "- Redis:                localhost:6379"

  postgres:
    image: postgres:18.2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iasg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-iasg}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iasg_user} -d ${POSTGRES_DB:-iasg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vulnerable_postgres:
    image: postgres:18.2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${VULN_POSTGRES_USER:-vuln_user}
      POSTGRES_PASSWORD: ${VULN_POSTGRES_PASSWORD:-vuln_changeme}
      POSTGRES_DB: ${VULN_POSTGRES_DB:-vuln_app}

    ports:
      - "5435:5432"
    volumes:
      - vulnerable_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VULN_POSTGRES_USER:-vuln_user} -d ${VULN_POSTGRES_DB:-vuln_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vulnerable_api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../vulnerable-app/backend:/app
      - vulnerable_api_node_modules:/app/node_modules
    environment:
      PORT: 5002
      PGHOST: vulnerable_postgres
      PGPORT: 5432
      PGUSER: ${VULN_POSTGRES_USER:-vuln_user}
      PGPASSWORD: ${VULN_POSTGRES_PASSWORD:-vuln_changeme}
      PGDATABASE: ${VULN_POSTGRES_DB:-vuln_app}
      AUTH_MODE: db_secure
    command: sh -c "npm ci && npm start"
    ports:
      - "5002:5002"
    depends_on:
      vulnerable_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway_dashboard_api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway-dashboard/api:/app
      - gateway_dashboard_api_node_modules:/app/node_modules
    environment:
      PORT: 4004
    command: sh -c "npm ci && npm start"
    ports:
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  vulnerable_web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../vulnerable-app:/app
      - vulnerable_web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5175"
    ports:
      - "5175:5175"
    depends_on:
      - vulnerable_api

  gateway_dashboard_web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway-dashboard/web:/app
      - gateway_dashboard_web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5177"
    ports:
      - "5177:5177"
    depends_on:
      - gateway_dashboard_api

  gateway:
    image: golang:1.24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway:/app
    environment:
      IASG_CONFIG: configs/config.yaml
      IASG_BACKEND_URL: http://vulnerable_api:5002
    command: sh -c "go run ./cmd/server"
    ports:
      - "8082:8082"
    depends_on:
      vulnerable_api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  docs:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: sh -c "pip install --no-cache-dir -r gateway/docs/requirements.txt && mkdocs serve -f mkdocs.yml -a 0.0.0.0:8000"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  vulnerable_postgres_data:
  redis_data:
  vulnerable_api_node_modules:
  gateway_dashboard_api_node_modules:
  vulnerable_web_node_modules:
  gateway_dashboard_web_node_modules: