# IASG Configuration Example
#
# This file is what the gateway boots with. The `enforcement` block below can
# also be changed at runtime from the console's Settings page, which stores an
# override in Redis and leaves this file untouched -- "Revert to file" there
# brings the gateway back to exactly what is written here. Everything outside
# `enforcement` is structural and only takes effect on a restart.

server:
  port: 8082
  host: 0.0.0.0
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

  # CIDRs whose X-Forwarded-For header is believed. Leave empty unless the
  # gateway really does sit behind a proxy: anyone can set the header, so
  # trusting it from arbitrary callers would let an attacker have someone
  # else's IP detected and blocked. When empty, the TCP peer address is used.
  trusted_proxies: []
    # - 127.0.0.1/32     # local testing
    # - 10.0.0.0/8       # load balancer subnet

proxy:
  # Backend API to protect
  backend_url: "http://localhost:5002"
  timeout: 30s
  max_idle_conns: 100
  max_conns_per_host: 10

storage:
  redis:
    enabled: true
    host: localhost
    port: 6379
    password: ""
    db: 0
    pool_size: 10
    # Hot window for dashboard + agentic AI (not full history)
    stream_key: iasg:events
    stream_maxlen: 2000
    ip_latest_ttl: 24h
  
  postgres:
    host: localhost
    port: 5434
    database: iasg
    username: iasg_user
    password: changeme
    ssl_mode: disable
    max_open_conns: 25
    max_idle_conns: 5

enforcement:
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst: 20

  # Attack detection (SQL injection signatures)
  attack_detection:
    enabled: true
    sql_patterns:
      - "' OR"
      - "--"
      - "UNION"
      - " OR 1=1"
  
  # Brute force login detection (detect + emit metrics only; no blocking)
  brute_force:
    enabled: true
    max_failures: 5 # failed logins inside the window before the signal fires
    window: 60s     # sliding window for counting failures
    login_paths:
      - "/api/login"

  # Path traversal + forced-browsing enumeration (detect + emit metrics only)
  enumeration_path_traversal:
    enabled: true
    traversal_patterns:
      - "../"
      - "..\\"
      - "%2e%2e%2f"
      - "%2e%2e/"
      - "..%2f"
      - "%2e%2e%5c"
    enumeration_patterns:
      - "/.env"
      - "/.git"
      - "/.aws"
      - "/wp-admin"
      - "/etc/passwd"
      - "/.bash_history"
      - "/.ssh"

  # Throttling
  throttle:
    enabled: true
    delay_ms: 500
  
  # Blocking
  block:
    enabled: true
    duration: 300s # 5 minutes

    signals:
    - api_flooding
    - brute_force
    min_score: 80
    exempt_cidrs:
    - 127.0.0.0/8
    - ::1/128 
    - 10.0.0.0/8
    - 192.168.0.0/16

  # Acting on decisions written by the Python control plane at policy:<ip>.
  # Off by default: turning this on is what lets the control plane refuse
  # live traffic, so it should be a deliberate choice.
  policy:
    enabled: false
    key_prefix: "policy:"
    refresh_interval: 5s # how stale an enforcement decision may be

signals:
  ip_reputation:
    enabled: true
    check_interval: 1h
  
  geo_location:
    enabled: true
  
  payload_analysis:
    enabled: true
    max_body_size: 1MB
  
  behavioral:
    enabled: true
    learning_period: 24h

logging:
  level: info
  format: json
  output: stdout
