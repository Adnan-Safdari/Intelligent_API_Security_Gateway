# IASG Configuration Example

server:
  port: 8080
  host: 0.0.0.0
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

proxy:
  # Backend API to protect
  backend_url: "http://localhost:5002"
  timeout: 30s
  max_idle_conns: 100
  max_conns_per_host: 10

trust_engine:
  # Trust scoring thresholds
  block_threshold: 20
  throttle_threshold: 50
  allow_threshold: 80
  
  # Signal weights
  weights:
    ip_reputation: 0.2
    rate_limiting: 0.25
    authentication: 0.3
    payload_analysis: 0.15
    behavioral: 0.1

storage:
  redis:
    host: localhost
    port: 6379
    password: ""
    db: 0
    pool_size: 10
  
  postgres:
    host: localhost
    port: 5434
    database: iasg
    username: iasg_user
    password: changeme
    ssl_mode: disable
    max_open_conns: 25
    max_idle_conns: 5

enforcement:
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst: 20
  
  # Throttling
  throttle:
    enabled: true
    delay_ms: 500
  
  # Blocking
  block:
    enabled: true
    duration: 300s # 5 minutes

signals:
  ip_reputation:
    enabled: true
    check_interval: 1h
  
  geo_location:
    enabled: true
  
  payload_analysis:
    enabled: true
    max_body_size: 1MB
  
  behavioral:
    enabled: true
    learning_period: 24h

logging:
  level: info
  format: json
  output: stdout
