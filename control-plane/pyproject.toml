[project]
name = "iasg-control-plane"
version = "0.1.0"
description = "Agentic security control plane for the Intelligent API Security Gateway"
requires-python = ">=3.11"

# The ONLY runtime dependency. Everything else is Python's standard library.
dependencies = [
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.1"]
ml = ["scikit-learn>=1.5,<2", "joblib>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iasg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the project root on sys.path so tests import iasg without relying on the
# editable install, which setuptools does not wire up correctly on Python 3.14.
# ".." puts the repository root on the path so the traffic harness in
# testing/traffic can be tested here, against the same extractor it has to
# produce data for. Checking a persona's plan by eye is not a check.
pythonpath = [".", ".."]
